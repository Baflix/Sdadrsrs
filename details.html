<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baflix - Movie Details</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=default,es6,fetch"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --primary: #e50914; --secondary: #b81d24; --dark: #141414; --light-dark: #222; --text: #fff; --text-secondary: #aaa; --green: #28a745; --blue: #007bff; --danger: #dc3545; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .back-header {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 50%;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-btn:hover { background: rgba(255,255,255,0.1); }
        .back-header .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #e50914, #f5f5f1);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            cursor: pointer;
        }

        .premium-badge-header {
            margin-left: auto;
            background: linear-gradient(45deg, #f7971e, #ffd200);
            color: #000;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            display: none;
            align-items: center;
            gap: 6px;
        }
        .premium-badge-header.visible { display: flex; }

        #loading-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
            flex-direction: column;
            gap: 20px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .details-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            display: none;
        }

        .movie-header {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 25px;
        }
        .movie-poster-large {
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        .movie-poster-large img {
            width: 100%;
            display: block;
        }
        .premium-badge-poster {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: linear-gradient(45deg, #f7971e, #ffd200);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
        }
        .movie-info-details { flex: 1; }
        .movie-title-large {
            font-size: 2.2rem;
            margin-bottom: 10px;
            line-height: 1.2;
        }
        .movie-meta {
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-size: 1rem;
        }
        #details-series-info {
            font-weight: bold;
            color: var(--green);
        }
        .trailer-btn {
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            transition: background 0.3s;
            font-size: 1rem;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: none;
            cursor: pointer;
            margin-top: 15px;
        }
        .trailer-btn:hover { background: var(--secondary); }

        .movie-description-full {
            padding: 20px 0;
            font-size: 1rem;
            line-height: 1.8;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            margin-bottom: 25px;
        }

        .actions-section {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .action-btn {
            color: #fff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            transition: all 0.3s;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            flex: 1;
            justify-content: center;
            min-width: 120px;
        }
        .action-btn.share { background: var(--blue); }
        .action-btn.copy { background: #6c757d; }
        .action-btn:hover { opacity: 0.85; transform: translateY(-2px); }

        .download-btn {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            background-size: 300% 300%;
            color: #fff;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            display: block;
            width: 100%;
            margin: 10px 0;
            border: none;
            box-shadow: 0 5px 15px rgba(220, 39, 67, 0.4);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: instaGradient 5s ease infinite;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .download-btn::before {
            content: '\f019';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            margin-right: 10px;
        }
        @keyframes instaGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .download-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(220, 39, 67, 0.6);
        }
        .download-btn:active { transform: translateY(1px) scale(0.98); }
        .download-btn.premium-locked {
            background: linear-gradient(45deg, #555, #333);
            animation: none;
            box-shadow: none;
        }
        .download-btn.premium-locked::before {
            content: '\f023';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            margin-right: 10px;
        }
        .download-btn.premium-locked:hover {
            transform: none;
            box-shadow: none;
        }

        .downloads-section { margin-top: 20px; }

        .season-accordion { margin-bottom: 8px; }
        .season-accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            cursor: pointer;
            width: 100%;
            border-radius: 8px;
            background: linear-gradient(145deg, #2c3e50, #34495e);
            border: 1px solid #4a627a;
            transition: all 0.3s ease;
        }
        .season-accordion-header:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            background: linear-gradient(145deg, #34495e, #4a627a);
        }
        .season-accordion-header h4 {
            font-size: 1.1rem;
            color: var(--text);
            font-weight: bold;
            margin: 0;
        }
        .season-accordion-header .fas {
            transition: transform 0.3s ease;
            color: var(--text-secondary);
            font-size: 1rem;
        }
        .season-accordion.active .season-accordion-header {
            background: linear-gradient(145deg, #3a506b, #4a627a);
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
        }
        .season-accordion.active .season-accordion-header .fas {
            transform: rotate(180deg);
            color: var(--text);
        }
        .season-accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), padding 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background-color: rgba(0,0,0,0.2);
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            padding: 0 15px;
        }
        .season-accordion.active .season-accordion-content {
            max-height: 3000px;
            padding: 20px 15px 10px;
        }
        .episode-container {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px dashed #383838;
        }
        .episode-container:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .episode-title {
            color: var(--text-secondary);
            margin-bottom: 10px;
            font-weight: bold;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .modal-overlay.visible {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background: #000;
            width: 95%;
            max-width: 900px;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
        }
        .modal-close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            z-index: 2;
            line-height: 1;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #error-message {
            text-align: center;
            padding: 50px 20px;
            display: none;
        }
        #error-message i {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 20px;
        }
        #error-message h2 {
            color: var(--text);
            margin-bottom: 10px;
        }
        #error-message p { color: var(--text-secondary); }

        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            color: #fff;
            padding: 15px 25px;
            border-radius: 12px;
            border-left: 4px solid #e50914;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 10000;
            max-width: 90%;
            text-align: center;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        @media (min-width: 600px) {
            .movie-header { flex-direction: row; align-items: flex-start; }
            .movie-poster-large { max-width: 250px; flex-shrink: 0; }
            .action-btn { flex: 0 1 auto; }
        }
        @media (max-width: 480px) {
            .actions-section { flex-direction: column; }
            .action-btn { width: 100%; }
            .movie-title-large { font-size: 1.6rem; }
        }

        .ad-popup-overlay {
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .ad-popup-content {
            background: linear-gradient(145deg, #1a1a1a, #222);
            padding: 35px 25px;
            border-radius: 24px;
            max-width: 420px;
            width: 92%;
            text-align: center;
            border: 1px solid rgba(229,9,20,0.3);
            box-shadow: 0 20px 60px rgba(229,9,20,0.2);
        }
        .ad-popup-content .ad-icon {
            font-size: 3rem;
            color: #ffd700;
            margin-bottom: 10px;
            animation: bounce 1.5s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .ad-popup-content h2 {
            color: #e50914;
            margin-bottom: 8px;
            font-size: 1.6rem;
        }
        .ad-popup-content .ad-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 5px;
        }
        .ad-popup-content .ad-highlight {
            color: #ffd700;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .ad-popup-content .ad-timer-info {
            color: #888;
            font-size: 0.8rem;
            margin: 8px 0 15px;
        }
        .ad-watch-btn {
            display: inline-block;
            background: linear-gradient(45deg, #f7971e, #ffd200);
            color: #000;
            padding: 16px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            margin: 10px 0 12px;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            box-shadow: 0 4px 20px rgba(255, 210, 0, 0.3);
            border: none;
            cursor: pointer;
        }
        .ad-watch-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(255, 210, 0, 0.5);
        }
        .ad-watch-btn i { margin-right: 10px; }
        .ad-skip-btn {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: underline;
            padding: 8px 16px;
            transition: color 0.3s;
            display: block;
            margin: 5px auto 0;
        }
        .ad-skip-btn:hover { color: #aaa; }
        .ad-loading-spinner {
            display: none;
            width: 30px;
            height: 30px;
            border: 3px solid #333;
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 15px auto;
        }
    </style>
</head>
<body>

    <div class="back-header">
        <button class="back-btn" id="back-btn"><i class="fas fa-arrow-left"></i></button>
        <span class="logo-text" id="details-logo">Baflix</span>
        <div class="premium-badge-header" id="premium-badge-header">
            <i class="fas fa-crown"></i> Premium
        </div>
    </div>

    <div id="loading-indicator">
        <div class="spinner"></div>
        <p style="color: var(--text-secondary);">Loading movie details...</p>
    </div>

    <div id="error-message">
        <i class="fas fa-exclamation-circle"></i>
        <h2>Movie Not Found</h2>
        <p>The movie you're looking for doesn't exist or has been removed.</p>
        <button class="action-btn" style="margin-top: 20px;" onclick="goHome()">
            <i class="fas fa-home"></i> Go Home
        </button>
    </div>

    <div class="details-container" id="details-container">
        <div class="movie-header" id="movie-header">
            <div class="movie-poster-large">
                <img id="detail-poster" src="" alt="Poster" onerror="this.src='https://via.placeholder.com/300x450/222/fff?text=No+Image'">
                <div class="premium-badge-poster" id="poster-premium-badge" style="display:none;">
                    <i class="fas fa-crown"></i> Premium
                </div>
            </div>
            <div class="movie-info-details">
                <h1 class="movie-title-large" id="detail-title"></h1>
                <p class="movie-meta" id="detail-genres"></p>
                <p class="movie-meta" id="detail-rating"></p>
                <p class="movie-meta" id="detail-year"></p>
                <p class="movie-meta" id="detail-language"></p>
                <p class="movie-meta" id="detail-series-info"></p>
                
                <div id="detail-trailer-container"></div>
            </div>
        </div>

        <div class="movie-description-full" id="detail-description"></div>

        <div class="actions-section" id="detail-actions"></div>

        <div class="downloads-section" id="detail-downloads"></div>
    </div>

    <div id="trailer-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close-btn" id="trailer-close-btn">&times;</button>
            <div class="video-container">
                <iframe id="youtube-trailer-iframe" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA3okSnZJrF9ooUp12KihKISR2VRZq5Ju8",
            authDomain: "baflix-man.firebaseapp.com",
            projectId: "baflix-man",
            storageBucket: "baflix-man.firebasestorage.app",
            messagingSenderId: "1041860946828",
            appId: "1:1041860946828:web:fa8b976dc07ced6ce704a9",
            measurementId: "G-XDZ9EFWCX5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const VSHORT_API = "c7d18a4a9d26ad6407fbd39fb85470d3c46f42d3";
        const VSHORT_URL = "https://vshort.xyz/api";
        const PREMIUM_HOURS = 12;

        const loadingIndicator = document.getElementById('loading-indicator');
        const detailsContainer = document.getElementById('details-container');
        const errorMessage = document.getElementById('error-message');
        const backBtn = document.getElementById('back-btn');
        const detailsLogo = document.getElementById('details-logo');
        const premiumBadgeHeader = document.getElementById('premium-badge-header');

        const modalOverlay = document.getElementById('trailer-modal');
        const trailerIframe = document.getElementById('youtube-trailer-iframe');
        const trailerCloseBtn = document.getElementById('trailer-close-btn');

        let currentUserId = null;
        let currentMovieId = null;
        let hasPremium = false;

        async function checkPremiumStatus(userId) {
            if (!userId) return { hasPremium: false, data: null };
            try {
                const docRef = doc(db, "premiumUsers", String(userId));
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const now = Date.now();
                    let expiry = data.expiry;
                    if (expiry && expiry.toDate) {
                        expiry = expiry.toDate().getTime();
                    } else if (expiry) {
                        expiry = new Date(expiry).getTime();
                    }
                    if (now < expiry && data.status === 'active') {
                        return { hasPremium: true, data: { ...data, expiry: expiry } };
                    } else {
                        if (data.status === 'active') {
                            await updateDoc(docRef, { status: 'expired' });
                        }
                        return { hasPremium: false, data: null };
                    }
                }
                return { hasPremium: false, data: null };
            } catch (error) {
                console.error("Error checking premium:", error);
                return { hasPremium: false, data: null };
            }
        }

        function generateToken(userId) {
            const random = Math.random().toString(36).substring(2, 10);
            const timestamp = Date.now().toString(36);
            return `${userId}_${timestamp}_${random}`;
        }

        async function createShortLink(originalUrl, alias = "") {
            try {
                const encodedUrl = encodeURIComponent(originalUrl);
                let apiUrl = `${VSHORT_URL}?api=${VSHORT_API}&url=${encodedUrl}&format=text`;
                if (alias) {
                    apiUrl += `&alias=${alias}`;
                }
                const response = await fetch(apiUrl);
                const shortLink = await response.text();
                if (shortLink && shortLink.startsWith("https://")) {
                    return shortLink.trim();
                } else {
                    return null;
                }
            } catch (error) {
                console.error("Error creating short link:", error);
                return null;
            }
        }

        function showToast(message) {
            const existing = document.querySelector('.toast-notification');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast-notification';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s';
                setTimeout(() => toast.remove(), 500);
            }, 5000);
        }

        function showAdPopupInIframe(shortLink, onComplete) {
            const existing = document.querySelector('.ad-popup-overlay');
            if (existing) existing.remove();
            
            const overlay = document.createElement('div');
            overlay.className = 'ad-popup-overlay';
            overlay.innerHTML = `
                <div class="ad-popup-content">
                    <div class="ad-icon"><i class="fas fa-crown"></i></div>
                    <h2>🎬 Unlock Premium</h2>
                    <p class="ad-subtitle">
                        Watch a short ad and get <span class="ad-highlight">${PREMIUM_HOURS} hours</span> of premium access!
                    </p>
                    <p class="ad-subtitle" style="font-size:0.85rem; color:#888;">
                        No ads, direct downloads, and full HD quality.
                    </p>
                    <div class="ad-timer-info">
                        <i class="fas fa-clock"></i> Token expires in 30 minutes
                    </div>
                    <a href="${shortLink}" target="_blank" class="ad-watch-btn" id="ad-watch-btn">
                        <i class="fas fa-play-circle"></i> Watch Ad Now
                    </a>
                    <div class="ad-loading-spinner" id="ad-loading-spinner"></div>
                    <p style="font-size:0.75rem; color:#555; margin-top:5px;">
                        After watching, you'll be redirected back automatically.
                    </p>
                    <button class="ad-skip-btn" id="ad-skip-btn">Skip for now</button>
                </div>
            `;
            document.body.appendChild(overlay);

            if (!document.getElementById('ad-popup-styles')) {
                const style = document.createElement('style');
                style.id = 'ad-popup-styles';
                style.textContent = `
                    .ad-popup-overlay {
                        position: fixed;
                        top:0; left:0; width:100%; height:100%;
                        background: rgba(0,0,0,0.92);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        z-index: 9999;
                        backdrop-filter: blur(10px);
                        animation: fadeIn 0.4s ease;
                    }
                    @keyframes fadeIn {
                        from { opacity: 0; transform: scale(0.95); }
                        to { opacity: 1; transform: scale(1); }

        async function checkUrlForVerification() {
            const params = new URLSearchParams(window.location.search);
            const verify = params.get('verify');
            const token = params.get('token');
            const userId = params.get('userId');
            
            if (verify === 'true' && token && userId) {
                const newUrl = window.location.pathname;
                window.history.replaceState({}, document.title, newUrl);
                
                try {
                    const docRef = doc(db, "premiumUsers", String(userId));
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        const now = Date.now();
                        let tokenExpiry = data.tokenExpiry;
                        if (tokenExpiry && tokenExpiry.toDate) {
                            tokenExpiry = tokenExpiry.toDate().getTime();
                        } else if (tokenExpiry) {
                            tokenExpiry = new Date(tokenExpiry).getTime();
                        }
                        
                        if (data.token === token && now < tokenExpiry) {
                            const expiryTime = new Date();
                            expiryTime.setHours(expiryTime.getHours() + PREMIUM_HOURS);
                            await updateDoc(docRef, {
                                expiry: expiryTime,
                                status: "active",
                                token: null,
                                tokenExpiry: null,
                                lastAdWatch: serverTimestamp()
                            });
                            showToast('🎉 Premium activated for 12 hours!');
                            premiumBadgeHeader.classList.add('visible');
                            hasPremium = true;
                            return true;
                        }
                    }
                } catch (error) {
                    console.error("Error verifying token:", error);
                }
                return false;
            }
            return false;
        }

        const parseEpisodeNumber = (epNumStr) => {
            const str = String(epNumStr).trim();
            if (str.includes('-')) {
                const parts = str.split('-').map(num => parseInt(num.trim(), 10));
                if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
                    const [start, end] = parts;
                    const count = Math.abs(end - start) + 1;
                    const highest = Math.max(start, end);
                    return { count, highest };
                }
            }
            const singleNum = parseInt(str, 10);
            if (!isNaN(singleNum)) return { count: 1, highest: singleNum };
            return { count: 1, highest: 0 };
        };

        const getYoutubeVideoId = (url) => {
            if(!url) return null;
            let videoId = null;
            try {
                const urlObj = new URL(url);
                if (urlObj.hostname === 'youtu.be') videoId = urlObj.pathname.slice(1);
                else if (urlObj.hostname.includes('youtube.com')) videoId = urlObj.searchParams.get('v');
            } catch (e) {
                const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
                const match = url.match(regex);
                if (match) videoId = match[1];
            }
            return videoId;
        };

        const copyToClipboard = (text, button) => {
            const originalText = button.innerHTML;
            const showSuccess = () => {
                button.innerHTML = `<i class="fas fa-check"></i> Copied!`;
                setTimeout(() => { button.innerHTML = originalText; }, 2000);
            };
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(showSuccess).catch(() => fallbackCopy(text, button, originalText));
            } else { fallbackCopy(text, button, originalText); }
        };

        const fallbackCopy = (text, button, originalText) => {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.top = '-9999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    button.innerHTML = `<i class="fas fa-check"></i> Copied!`;
                    setTimeout(() => { button.innerHTML = originalText; }, 2000);
                }
            } catch (err) { console.error("Error during fallback copy:", err); }
            document.body.removeChild(textArea);
        };

            const movieId = getMovieIdFromUrl();
            console.log("🎬 Movie ID from URL:", movieId);
            
            if (movieId) {
                // ✅ SUPER FAST - only 50ms delay
                setTimeout(() => {
                    loadMovieDetails(movieId);
                }, 50);
            } else {
                console.log("❌ No movie ID found, going home");
                goHome();
            }
        };

        initializeDetails();
    </script>
